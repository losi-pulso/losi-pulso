name: PULSO Android APK (teste)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-pulso/**'
      - '.github/workflows/pulso-android-apk.yml'

permissions:
  contents: read

jobs:
  apk-android:
    name: Compilar APK de teste
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        run: gradle -p android-pulso :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-Android-TESTE
          path: android-pulso/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
