name: PULSO Android APK (teste)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-pulso/**'
      - '.github/workflows/pulso-android-apk.yml'

permissions:
  contents: read

jobs:
  apk-android:
    name: Compilar APK de teste
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu runners already ship Android SDK command-line tools. Installing
      # legacy "tools" using setup-android@v3 fails with "package tools not found".
      - name: Confirmar Android SDK existente
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -n "${ANDROID_HOME:-}" && test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -f "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Instalar plataforma Android 36
        shell: bash
        run: |
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        run: gradle -p android-pulso :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-Android-TESTE
          path: android-pulso/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
